backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website"
    files:
      - label: "Title and intro"
        name: "site"
        file: "data/site.json"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
      - label: "Gallery"
        name: "gallery"
        file: "data/gallery.json"
        fields:
          - label: "Pictures"
            name: "items"
            widget: "list"
            fields:
              - {label: "Picture", name: "image", widget: "image"}
              - {label: "Caption", name: "caption", widget: "string"}
